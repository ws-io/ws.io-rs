name: Multi-Platform Verification & Code Coverage

on:
  push:
    tags:
      - wsio-client-v*
      - wsio-core-v*
      - wsio-server-v*
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: llvm-tools-preview

      - name: Install mold
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests and show coverage
        run: cargo coverage

      - name: Generate lcov report
        if: ${{ runner.os == 'Linux' }}
        run: cargo coverage-generate --no-run

      - name: Upload lcov report to codecov
        if: ${{ runner.os == 'Linux' }}
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: ./lcov.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
