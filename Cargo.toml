[workspace]
members = [
  "crates/*",
]

resolver = "3"

[workspace.package]
edition = "2024"
# homepage = ""
license = "MIT"
repository = "https://github.com/ws-io/ws.io-rs"

categories = [
  "asynchronous",
  "concurrency",
  "network-programming",
  "web-programming::websocket",
]

keywords = [
  "messaging",
  "network",
  "realtime",
  "websocket",
  "ws",
]

# Optional cargo/tool metadata.
# [package.metadata]


# =============================================================================
# Lints
# =============================================================================

[workspace.lints.clippy]

# Lint groups
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Deny
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
expect_used = "deny"
fn_to_numeric_cast_any = "deny"
items_after_statements = "deny"
missing_safety_doc = "deny"
needless_for_each = "deny"
semicolon_if_nothing_returned = "deny"
transmute_ptr_to_ptr = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_mut_passed = "deny"
unnecessary_sort_by = "deny"
unused_async = "deny"
unwrap_used = "deny"

# Warn
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_ptr_alignment = "warn"
cast_sign_loss = "warn"
doc_markdown = "warn"
fn_params_excessive_bools = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
manual_let_else = "warn"
many_single_char_names = "warn"
match_same_arms = "warn"
mutex_atomic = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_mutex = "warn"
struct_excessive_bools = "warn"
todo = "warn"
too_many_arguments = "warn"
trivially_copy_pass_by_ref = "warn"
unimplemented = "warn"
unnecessary_wraps = "warn"
unreadable_literal = "warn"
unused_self = "warn"

# Allow
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
used_underscore_binding = "allow"

[workspace.lints.rust]

# Deny
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

# Warn
missing_debug_implementations = "warn"
unreachable_pub = "warn"

# Allow
missing_docs = "allow"

[workspace.lints.rustdoc]

# Deny
broken_intra_doc_links = "deny"

# Warn
private_intra_doc_links = "warn"

# Allow
missing_crate_level_docs = "allow"

# =============================================================================
# Dependencies
# =============================================================================

[workspace.dependencies]
wsio-client = { path = "./crates/wsio-client", version = "0.9.0" }
wsio-core = { path = "./crates/wsio-core", version = "0.13.0" }
wsio-server = { path = "./crates/wsio-server", version = "0.13.0" }

# =============================================================================
# Profiles
# =============================================================================
# Prefer defining profiles at the workspace root.
# Profiles in dependency crates are ignored by Cargo.

# [profile.dev]
# opt-level = 0
# debug = true
# incremental = true
# overflow-checks = true

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = true
panic = "abort"
strip = "symbols"

# Faster release build, slightly less optimized than full LTO.
# [profile.release-fast]
# inherits = "release"
# lto = "thin"
# codegen-units = 16

# Smaller binary profile.
# [profile.release-small]
# inherits = "release"
# opt-level = "z"
# lto = true
# codegen-units = 1
# panic = "abort"
# strip = "symbols"

# [profile.test]
# opt-level = 0
# debug = true

# [profile.bench]
# inherits = "release"
# debug = true

# =============================================================================
# Dependency overrides
# =============================================================================

# [patch.crates-io]
# crate-name = { git = "https://github.com/owner/crate-name", branch = "main" }
